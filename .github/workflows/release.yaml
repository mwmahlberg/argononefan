name: Release

on:
  push:
    tags:
      - "*.*.*"
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code
      - name: Check out code
        uses: actions/checkout@v3

      # Step 2: Set up Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go version

      # Step 3: Run GoReleaser to build release artifacts
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: latest
          args: release
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Step 4: Generate changelog using requarks/changelog-action
      - name: Generate Changelog
        id: changelog
        uses: requarks/changelog-action@7ce6be4c4d2233ae2a943694ca34f23aeafa1054 # v1
        with:
          token: ${{ github.token }}

      # Step 5: Create GitHub Release
      - name: Create Release
        uses: ncipollo/release-action@a2e71bdd4e7dab70ca26a852f29600c98b33153e # v1.12.0
        with:
          allowUpdates: true
          draft: false
          makeLatest: true
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changes }}
          token: ${{ github.token }}
